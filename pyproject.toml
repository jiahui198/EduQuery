[project]
name = "eduquery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jiahui198", email = "1356479419@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncmy>=0.2.16",
    "bcrypt==4.0.1",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "dashscope>=2.0.1",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "milvus-lite>=3.2.2",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings>=2.16.0",
    "pymilvus[milvus-lite]>=3.0.2",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
eduquery = "eduquery:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
