name: eduquery

services:
  app:
    build: .
    image: eduquery-app:1.0
    container_name: eduquery-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    mem_limit: 800m
    memswap_limit: 1400m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  default:
    external: true
    name: deploy_qra-net
